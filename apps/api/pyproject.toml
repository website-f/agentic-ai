[project]
name = "agentic"
version = "0.1.0"
description = "Agentic-AI API and Temporal worker"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "redis>=5.2",
    "temporalio>=1.9",
    "python-ulid>=3.0",
    "httpx>=0.28",
    "cryptography>=44",
    "fastembed>=0.8.1",
    "dulwich>=1.2",
    "pgvector>=0.5",
    "tzdata>=2026.4",
    "http-ece>=1.2",
    "jsonschema>=4.23",
    "cronsim>=2.7",
    "pypdfium2>=4.30",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
    "pillow>=11",
    "lxml>=5.3",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
# ASYNC109: our `timeout` args are httpx request timeouts, not asyncio cancellation.
ignore = ["S101", "B008", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# F811: pytest fixtures imported from another test module look like redefinitions.
"tests/*" = ["S105", "S106", "F811"]
# E501: the threat-pattern table reads best one regex per line.
"agentic/core/threats.py" = ["E501"]
# E501: tool descriptions and report rows read best on one line each.
"agentic/assistants/tools.py" = ["E501"]
"agentic/assistants/insights.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "../egress/tests"]

[tool.pyright]
include = ["agentic"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
