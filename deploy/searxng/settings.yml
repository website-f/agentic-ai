# SearXNG for agents' web_search and research_gather (P39): one private metasearch that asks
# several engines at once, so research does not depend on one engine's bot check.
# Reached only by the worker on the internal `search` network; never published.
# The secret comes from SEARXNG_SECRET (docker-compose.yml).
use_default_settings: true

general:
  instance_name: "agentic-search"
  enable_metrics: false

server:
  # Private instance: only our worker calls it, so no rate limiter and no image proxy.
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  autocomplete: ""
  # json is what the worker reads (agents/websearch.py).
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 50
  pool_maxsize: 10

# The default engines (Google, Bing, DuckDuckGo, Brave, Startpage, Wikipedia, ...) stay on;
# results merge across them, so one engine blocking us does not empty the results.
