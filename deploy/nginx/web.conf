# Serves the built PWA and proxies the API. Runs as non-root on 8080, read-only rootfs
# (compose mounts /tmp as tmpfs; nginx-unprivileged keeps its pid and temp files there).

# Docker's DNS. Without `resolve`, nginx keeps the api's IP from startup, and a restarted
# api container (new IP) leaves every /api request on 502 until web restarts too.
resolver 127.0.0.11 valid=10s ipv6=off;

# Behind the shared Caddy the browser spoke HTTPS: keep that scheme for the api instead of
# the plain-HTTP hop between Caddy and this container.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# The client's real address. The only hops in front of this container are the host's reverse
# proxy (Orxies/Caddy, reaching the published 127.0.0.1 port through Docker's bridge) and,
# locally, nothing. Trust X-Forwarded-For only from those private hops and take the right-most
# address that is NOT one of them: a client cannot pick its own IP by sending a forged
# X-Forwarded-For, because the left part of the header (what the client wrote) is never used.
# Every proxy block below then sends the api exactly one address, $remote_addr (overwritten,
# never appended), in both X-Real-IP and X-Forwarded-For.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from ::1;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

upstream agentic_api {
    zone agentic_api 64k;
    server api:8501 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 25m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Security headers. Only same-origin scripts and connections; no inline scripts
    # (the theme bootstrap is public/theme-init.js for exactly this reason).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # The microphone is for voice input in chat (P18), from this site only.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Live event stream (P2+): no buffering, long reads.
    location /api/events {
        proxy_pass http://agentic_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Meeting recordings (minutes): up to ~1 GB of audio/video, streamed straight through to
    # the api (no buffering to nginx's small /tmp), with time for a slow connection. Keep the
    # limit a little above AGENTIC_MINUTES_MAX_MB. The server's reverse proxy (Orxies/Caddy)
    # does not cap request bodies, so this is the only limit in front of the api.
    location = /api/minutes/upload {
        client_max_body_size 1100m;
        client_body_timeout 10m;
        proxy_request_buffering off;
        proxy_pass http://agentic_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_send_timeout 2h;
        proxy_read_timeout 10m;
    }

    # Company documents (P24): a zip of up to 200 MB (agentic/intake/unpack.MAX_ZIP_BYTES),
    # streamed straight through for the same reason as recordings.
    location = /api/intake {
        client_max_body_size 210m;
        client_body_timeout 10m;
        proxy_request_buffering off;
        proxy_pass http://agentic_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_send_timeout 30m;
        proxy_read_timeout 10m;
    }

    # Company files out (P24): one file, its preview, or a zip of a folder / a whole company
    # (up to 1 GB). Streamed to the browser instead of spooling into nginx's small /tmp.
    location ~ ^/api/files/(archive|[^/]+/(download|preview))$ {
        # The app shows previews in its own frame: allow being framed by this site only (the
        # server-wide policy says frame-ancestors 'none'). The API adds its strict, sandboxed
        # policy for what the file itself may do; both apply.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        proxy_pass http://agentic_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 30m;
    }

    # P31: the PC agent's one-line installers (`irm https://HOST/i/CODE/win | iex`,
    # `curl -fsSL https://HOST/i/CODE/mac | sh`), served by the api at /api/install/CODE/...
    location /i/ {
        proxy_pass http://agentic_api/api/install/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    # P31: each linked PC keeps one WebSocket open (it pings every 25 s).
    location = /api/devices/connect {
        proxy_pass http://agentic_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # P31: the CDP relay from a PC's browser (raw DevTools frames, up to 16 MB, 2 h idle).
    location /api/devices/cdp/ {
        proxy_pass http://agentic_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }

    # P31: a PC uploads one file for its AI (devices.core.MAX_UPLOAD = 25 MB), streamed.
    location ^~ /api/devices/uploads/ {
        client_max_body_size 26m;
        proxy_request_buffering off;
        proxy_pass http://agentic_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_send_timeout 10m;
        proxy_read_timeout 5m;
    }

    location /api/ {
        proxy_pass http://agentic_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Guide screenshots and videos (P20): refreshed now and then, so a day of caching.
    # Videos are served with byte ranges, which iPhone Safari needs to play them.
    location /guide-media/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # P31: the PC agent (one file + its SHA-256) the one-line installers download. Always
    # revalidated, so a new agent reaches the next install at once.
    location /downloads/pc-agent/ {
        default_type text/plain;
        types { }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The shell, service worker and manifest must always revalidate, or updates stall.
    location ~* ^/(index\.html|sw\.js|manifest\.webmanifest|theme-init\.js)$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        try_files $uri =404;
    }

    # Client-side routes fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
