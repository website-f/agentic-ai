# VPS overrides, behind the server's reverse proxy (Caddy or Orxies terminates TLS).
#
#   cp .env.vps.example .env && nano .env
#   install -d -o 10001 -g 10001 data/backups data/restore
#   ./deploy/scripts/deploy-vps.sh     # backup, pull, build, up, port check (every deploy)
#
# Never a bare `docker compose up -d --build` on the server: without this file that is dev
# mode, with the dev test logins and the dev ports.
#
# What changes from the local stack:
#   - only `web` is published, on 127.0.0.1:${AGENTIC_PORT}; Caddy is the only way in
#   - Postgres, Valkey, Temporal and the api publish nothing; the data network is internal
#   - the browser network is internal in every stack (docker-compose.yml): the browser's
#     only way out is the egress proxy, which refuses non-public addresses
#   - Temporal UI stays on 127.0.0.1:8502 for an SSH tunnel / Tailscale, never public; it
#     publishes through its own `ops` network, not `edge` (it only talks to Temporal)
#   - WAHA_IMAGE must be pinned in .env (a tag or digest, never latest)
#   - production mode: the api refuses to start without real secrets and Secure cookies
#   - every secret is required (`:?`), so a missing value stops the deploy, not the app
x-prod-env: &prod-env
  AGENTIC_ENV: prod
  AGENTIC_SECRET_KEY: ${AGENTIC_SECRET_KEY:?set AGENTIC_SECRET_KEY in .env}
  AGENTIC_MASTER_KEY: ${AGENTIC_MASTER_KEY:?set AGENTIC_MASTER_KEY in .env}
  AGENTIC_COOKIE_SECURE: "true"
  AGENTIC_DEV_SEED: "false"
  AGENTIC_DATABASE_URL: postgresql+asyncpg://agentic:${AGENTIC_DB_PASSWORD:?set AGENTIC_DB_PASSWORD in .env}@postgres:5432/agentic
  AGENTIC_BROWSER_TOKEN: ${AGENTIC_BROWSER_TOKEN:?set AGENTIC_BROWSER_TOKEN in .env}
  AGENTIC_SANDBOX_TOKEN: ${AGENTIC_SANDBOX_TOKEN:?set AGENTIC_SANDBOX_TOKEN in .env}
  AGENTIC_WAHA_API_KEY: ${AGENTIC_WAHA_API_KEY:?set AGENTIC_WAHA_API_KEY in .env}
  AGENTIC_PUBLIC_URL: ${AGENTIC_PUBLIC_URL:?set AGENTIC_PUBLIC_URL in .env (https://your.domain)}

services:
  postgres:
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${AGENTIC_DB_PASSWORD:?set AGENTIC_DB_PASSWORD in .env}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}

  valkey:
    ports: !override []

  temporal:
    ports: !override []
    environment:
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}

  temporal-ui:
    ports: !override ["127.0.0.1:${TEMPORAL_UI_PORT:-8502}:8080"]
    # The data network is internal, so publishing needs a normal network: its own `ops`,
    # shared with nothing else (it only talks to Temporal, over data).
    networks: [data, ops]

  api:
    ports: !override []
    environment: *prod-env
    # Meeting recordings (minutes) stream to /data/media, shared with the worker. Point
    # AGENTIC_MEDIA_DIR at a host folder on a disk with room for a few 1 GB uploads at once
    # (install -d -o 10001 -g 10001 data/media); originals are deleted after extraction and
    # the small audio copies after the retention days set in the app.
    volumes:
      - "${AGENTIC_VAULT_DIR:-vault}:/data/vault"
      - "${AGENTIC_MEDIA_DIR:-media}:/data/media"

  worker:
    environment: *prod-env
    volumes:
      - "${AGENTIC_VAULT_DIR:-vault}:/data/vault"
      - "${AGENTIC_MEDIA_DIR:-media}:/data/media"

  web:
    ports: !override ["127.0.0.1:${AGENTIC_PORT:-8500}:8080"]

  browser:
    environment:
      BROWSER_TOKEN: ${AGENTIC_BROWSER_TOKEN:?set AGENTIC_BROWSER_TOKEN in .env}
      # A datacenter IP is watched harder than a home/office line, so pace it gentler here
      # (a wider gap, fewer actions per minute). Override in .env if a portal is still strict.
      BROWSER_PACE_MIN: ${BROWSER_PACE_MIN:-4}
      BROWSER_PACE_JITTER: ${BROWSER_PACE_JITTER:-3}
      BROWSER_PACE_MAX_PER_MIN: ${BROWSER_PACE_MAX_PER_MIN:-12}

  waha:
    # A new WAHA image may not read the sessions an old one wrote: never `latest` here.
    image: ${WAHA_IMAGE:?set WAHA_IMAGE in .env to a pinned tag or digest (see .env.vps.example)}
    environment:
      WAHA_API_KEY: ${AGENTIC_WAHA_API_KEY:?set AGENTIC_WAHA_API_KEY in .env}

  practice-portal:  # profile demo: only the egress proxy (for the browser) reaches it
    ports: !override []

  sandbox:
    environment:
      SANDBOX_TOKEN: ${AGENTIC_SANDBOX_TOKEN:?set AGENTIC_SANDBOX_TOKEN in .env}

  backup:
    environment:
      PGPASSWORD: ${AGENTIC_DB_PASSWORD:?set AGENTIC_DB_PASSWORD in .env}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD in .env}
      AGENTIC_SECRET_KEY: ${AGENTIC_SECRET_KEY:?set AGENTIC_SECRET_KEY in .env}
      AGENTIC_MASTER_KEY: ${AGENTIC_MASTER_KEY:?set AGENTIC_MASTER_KEY in .env}

networks:
  # Postgres, Valkey and Temporal get no route to the internet at all. api, worker and
  # backup reach out (AI providers, push services, Telegram, offsite backups) via edge.
  data:
    internal: true
  ops: {}  # Temporal UI's published port only
